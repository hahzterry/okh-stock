<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock Scanner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
</head>
<body>
    <div id="app">
        <header>
            <h1>Stock</h1>
            <div class="status" id="status">Ready</div>
        </header>

        <main>
            <!-- Scanner Viewport -->
            <div id="scanner-container">
                <video id="scanner-video" playsinline></video>
                <div class="scan-region"></div>
                <button id="btn-start-scan" class="primary-btn">Start Camera</button>
            </div>

            <!-- Custom Segmented Control (Replaces the dropdown) -->
            <div class="segmented-control" id="scan-type-control">
                <button class="segment active" data-value="Warehouse">Warehouse</button>
                <button class="segment" data-value="Job">Job</button>
                <button class="segment" data-value="Return">Return</button>
                <button class="segment" data-value="Pickup">Pickup</button>
            </div>

            <!-- Export Button -->
            <button id="btn-export" class="secondary-btn full-width">Export CSV</button>

            <!-- Results List -->
            <div id="results-list">
                <h3>Scanned Items (<span id="count">0</span>)</h3>
                <ul id="scan-list"></ul>
            </div>
        </main>
    </div>
    
    <!-- ZXing Library for reliable iOS scanning -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
