<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OKH Stock Scanner</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
</head>
<body>
    <div id="app">
        <header>
            <h1>OKH Stock</h1>
            <div class="status" id="status">Ready</div>
        </header>

        <main>
            <!-- Scanner Viewport -->
            <div id="scanner-container">
                <video id="scanner-video" playsinline></video>
                <div class="scan-region"></div>
                <button id="btn-start-scan" class="primary-btn">Start Camera</button>
            </div>

            <!-- Controls -->
            <div class="controls">
                <select id="scan-type">
                    <option value="Warehouse">Warehouse</option>
                    <option value="Job">Job</option>
                    <option value="Return">Return to OKH</option>
                    <option value="Pickup">Pickup from OKH</option>
                </select>
                <button id="btn-export" class="secondary-btn">Export CSV</button>
            </div>

            <!-- Results List -->
            <div id="results-list">
                <h3>Scanned Items (<span id="count">0</span>)</h3>
                <ul id="scan-list"></ul>
            </div>
        </main>
    </div>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="app.js"></script>
</body>
</html>
